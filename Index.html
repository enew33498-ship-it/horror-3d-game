<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Night House</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="game">

    <!-- Horror background -->
    <div id="background"></div>

    <!-- Dark overlay -->
    <div id="darkness"></div>

    <!-- Game UI -->
    <div id="ui">
      <div id="title">NIGHT HOUSE</div>
      <div id="objective">Find a way inside...</div>
    </div>

    <!-- Player -->
    <div id="player">🧍</div>

    <!-- Touch controls -->
    <div id="controls">

      <div class="control-row">
        <button id="up">▲</button>
      </div>

      <div class="control-row">
        <button id="left">◀</button>
        <button id="down">▼</button>
        <button id="right">▶</button>
      </div>

    </div>

    <!-- Start screen -->
    <div id="startScreen">
      <h1>NIGHT HOUSE</h1>
      <p>You shouldn't have come here...</p>
      <button id="startButton">START GAME</button>
    </div>

  </div>

  <script src="game.js"></script>

</body>
  </html>
